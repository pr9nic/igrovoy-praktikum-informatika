# Проверки без браузера и без школьного сервера: логика игр (Node), серверные модули (Flask), издатель и Godot headless.
# Браузерные тесты (tools/trainer/tests/*.test.mjs) нужен настоящий журнал школы — их запускают на сервере: bash tools/run_all_tests.sh
name: Проверки
on:
  push:
  pull_request:
jobs:
  logic:
    name: Логика и серверные модули
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: bash tools/run_all_tests.sh quick
  godot:
    name: Godot headless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q godot.zip && mkdir -p ~/.local/bin && mv "Godot_v${GODOT}_linux.x86_64" ~/.local/bin/godot && rm godot.zip
      - run: godot --headless --path godot/workshop --import > /dev/null 2>&1 || true
      - run: |
          for t in solutions cells world arcade; do
            echo "::group::$t"; timeout 600 godot --headless --path godot/workshop --script res://tests/$t.gd | grep -v "^ok "; s=${PIPESTATUS[0]}; echo "::endgroup::"
            [ "$s" -eq 0 ] || { echo "::error::Godot: tests/$t.gd"; exit 1; }
          done
